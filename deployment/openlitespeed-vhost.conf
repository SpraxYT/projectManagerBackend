docRoot $VH_ROOT/public_html
vhDomain $VH_NAME
vhAliases www.$VH_NAME
adminEmails aymeric@aymcode.fr
enableGzip 1
enableIpGeo 1

errorlog $VH_ROOT/logs/$VH_NAME.error_log {
  useServer 0
  logLevel WARN
  rollingSize 10M
}

accesslog $VH_ROOT/logs/$VH_NAME.access_log {
  useServer 0
  logFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\""
  logHeaders 5
  rollingSize 10M
  keepDays 10
  compressArchive 1
}

# ========================================
# EXT PROCESSORS
# ========================================

# Backend API (port à personnaliser)
extprocessor backend-api {
  type proxy
  address 127.0.0.1:4005
  maxConns 100
  initTimeout 1800
  retryTimeout 0
  respBuffer 0
  pcKeepAliveTimeout 60
}

# Frontend Next.js (port à personnaliser)
extprocessor frontend-nextjs {
  type proxy
  address 127.0.0.1:3015
  maxConns 100
  initTimeout 1800
  retryTimeout 0
  respBuffer 0
  pcKeepAliveTimeout 60
}

# ========================================
# CONTEXTS - ORDRE IMPORTANT !
# ========================================

# Backend API - /api/*
context /api/ {
  type proxy
  handler backend-api
  addDefaultCharset off
  reqTimeout 1800
  retryTimeout 0
  respTimeout 1800
}

# Fichiers uploadés - /uploads/*
context /uploads/ {
  type proxy
  handler backend-api
  addDefaultCharset off
}

# Frontend Next.js - Toutes les autres routes
context / {
  type proxy
  handler frontend-nextjs
  addDefaultCharset off
  reqTimeout 1800
  retryTimeout 0
  respTimeout 1800
}

# ACME Challenge
context /.well-known/acme-challenge {
  location /usr/local/lsws/Example/html/.well-known/acme-challenge
  allowBrowse 1
  rewrite {
    enable 0
  }
  addDefaultCharset off
}

# SSL (à adapter selon le domaine)
vhssl {
  keyFile /etc/letsencrypt/live/$VH_NAME/privkey.pem
  certFile /etc/letsencrypt/live/$VH_NAME/fullchain.pem
  certChain 1
  sslProtocol 24
  enableECDHE 1
  renegProtection 1
  sslSessionCache 1
  enableSpdy 15
  enableStapling 1
  ocspRespMaxAge 86400
}
